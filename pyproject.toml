[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kacha-bench"
version = "0.0.1"
description = "Procedurally generated rural monsoon-road terrain benchmark for legged-robot locomotion RL (MuJoCo/MJX)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "S. M. Nihal Ahmed" }]
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2", "mujoco-menagerie", "numpy", "imageio", "imageio-ffmpeg", "matplotlib"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "gymnasium>=0.29", "psutil"]
mjx = ["mujoco-mjx", "jax"]

[tool.setuptools]
packages = ["kacha"]
